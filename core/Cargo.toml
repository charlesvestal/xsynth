[package]
name = "xsynth-core"
description = "A fast Rust-based SoundFont synthesizer designed for high voice counts and low latency."
authors = ["Arduano", "MBMS", "Kaydax", "Khangaroo"]
readme = "README.md"

version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
atomic_refcell = "0.1.13"
bytemuck = "1.16.3"
crossbeam-channel = "0.5.13"
lazy_static = "1.5.0"
xsynth-soundfonts = { workspace = true }
rayon = "1.10.0"
spin_sleep = "1.2.1"
to_vec = "0.1.0"
thiserror = "1.0.63"
symphonia = "0.5.4"
memmap2 = "0.9"
biquad = "0.4.2"
simdeez = "3.0.1"
proc-macro2 = "1.0.86"
# MOVE FORK / Phase 9 evaluation: fundsp for delay/reverb/chorus/phaser.
# MIT/Apache-2.0 — compatible with our LGPL-3.0 fork.
fundsp = { version = "0.21", default-features = false }
serde = { version = "1.0", optional = true, features = ["derive"] }

[features]
serde = ["dep:serde"]

[dev-dependencies]
midi-toolkit-rs = "0.1.0"
rand = "0.8.5"
criterion = "0.5.1"

[[bench]]
name = "render"
harness = false

[[bench]]
name = "send_events"
harness = false

# MOVE FORK / 2026-05-16: Mac-side CLI to pre-bake `.x44c` sample caches
# for sample libraries that would otherwise take 30+ minutes to decode
# on Move's CPU at first-load time. Walks a directory of audio files
# and decodes each in parallel via rayon.
[[bin]]
name = "prebake_cache"
path = "src/bin/prebake_cache.rs"

# MOVE FORK / 2026-05-16: render a 4-note chord through xsynth-core +
# the on-device master gain + peak limiter, output raw + processed
# WAVs. Used to debug output-stage distortion off-device.
[[bin]]
name = "chord_render"
path = "src/bin/chord_render.rs"
